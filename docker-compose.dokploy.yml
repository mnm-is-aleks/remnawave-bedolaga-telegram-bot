services:
  bedolaga-db:
    image: postgres:17-alpine
    hostname: bedolaga-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bedolaga_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bedolaga_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - bedolaga-db-data:/var/lib/postgresql/data
    networks:
      - bedolaga-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bedolaga_user} -d ${POSTGRES_DB:-bedolaga_bot}']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  bedolaga-redis:
    image: valkey/valkey:8-alpine
    hostname: bedolaga-redis
    restart: unless-stopped
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - bedolaga-redis-data:/data
    networks:
      - bedolaga-network
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      bot-init:
        condition: service_completed_successfully
      bedolaga-db:
        condition: service_healthy
      bedolaga-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FORCE_COLOR: '1'
      DOCKER_ENV: 'true'
      DATABASE_MODE: 'postgresql'
      POSTGRES_HOST: 'bedolaga-db'
      POSTGRES_PORT: '5432'
      POSTGRES_DB: '${POSTGRES_DB:-bedolaga_bot}'
      POSTGRES_USER: '${POSTGRES_USER:-bedolaga_user}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      REDIS_URL: 'redis://bedolaga-redis:6379/0'
      TZ: 'Europe/Moscow'
    expose:
      - ${WEB_API_PORT:-8090}
    volumes:
      - ../files/bot-logs:/app/logs
      - ../files/bot-data:/app/data
      - ../files/bot-uploads:/app/uploads
    networks:
      - bedolaga-network
      - remnawave-network
      - dokploy-network

volumes:
  bedolaga-db-data:
  bedolaga-redis-data:

networks:
  bedolaga-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  remnawave-network:
    external: true
    name: ${REMNAWAVE_NETWORK_NAME}
  dokploy-network:
    external: true
